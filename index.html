<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F4EE" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E0E11" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Avantage Plus — Plateforme F&I signature. Présentations véhicules prestige, binaire, rapide." />

    <!-- Open Graph / Twitter -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Avantage Plus — F&I Prestige" />
    <meta property="og:description" content="L'expérience F&I 2.0 pour les concessionnaires qui se distinguent." />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Preconnect aux fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Fraunces + Inter (variables) — preload critique -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500;1,9..144,600&family=Inter:wght@300;400;500;600;700;800;900&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500;1,9..144,600&family=Inter:wght@300;400;500;600;700;800;900&display=swap"
    />

    <title>Avantage Plus — F&I Prestige</title>

    <style>
      /* ── Splash prestige (retiré au 1er render React) ── */
      #app-splash {
        position: fixed; inset: 0;
        display: flex; align-items: center; justify-content: center;
        background: #F7F4EE;
        z-index: 9999;
        transition: opacity 0.4s ease;
        font-family: 'Fraunces', Georgia, serif;
      }
      #app-splash .mark {
        font-style: italic;
        font-weight: 500;
        font-size: clamp(2.5rem, 6vw, 4rem);
        color: #0E0E11;
        letter-spacing: -0.02em;
        position: relative;
      }
      #app-splash .mark span {
        color: #B8935A;
      }
      #app-splash .mark::after {
        content: '';
        position: absolute;
        left: 0; right: 0; bottom: -14px;
        height: 1px; background: #B8935A;
        transform-origin: left;
        animation: splashLine 1.1s cubic-bezier(0.16,1,0.3,1) both;
      }
      @keyframes splashLine {
        from { transform: scaleX(0); opacity: 0.6; }
        to   { transform: scaleX(1); opacity: 1; }
      }
      @media (prefers-color-scheme: dark) {
        #app-splash { background: #0E0E11; }
        #app-splash .mark { color: #F7F4EE; }
      }
    </style>
  </head>
  <body>
    <div id="app-splash" aria-hidden="true">
      <div class="mark">Avantage <span>Plus</span></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      window.addEventListener('load', function () {
        setTimeout(function () {
          var s = document.getElementById('app-splash');
          if (s) { s.style.opacity = '0'; setTimeout(function(){ s.remove(); }, 450); }
        }, 650);
      });
    </script>
  </body>
</html>
